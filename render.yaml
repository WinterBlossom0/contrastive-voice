# Render Blueprint: New > Blueprint, select the repository. Render sets PORT and the app reads it.
services:
  - type: web
    name: contrastive-voice
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "standard" is the smallest plan with 2 GB RAM, which CPU torch and the 378 MB aligner need
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: false
