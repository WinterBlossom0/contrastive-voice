[project]
name = "cvoice"
version = "0.1.0"
description = "Contrastive Voice: reference-relative speech delivery analysis with temporal flaw grounding"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/cvoice/static/vendor/LICENSE-*.txt"]
authors = [{ name = "WinterBlossom0" }]
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "soxr",
    "praat-parselmouth",
    "cmudict",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
cvoice = "cvoice.app:main"

[project.optional-dependencies]
# exactly one of these two is installed: `uv sync --locked --extra cpu` (laptop, Docker, CPU kernels) or `--extra gpu` (Kaggle T4 x2)
cpu = ["torch==2.10.0", "torchaudio==2.10.0"]
gpu = ["torch==2.10.0", "torchaudio==2.10.0"]

[dependency-groups]
dev = ["pytest", "ruff"]
# dataset build, calibration, evaluation (Kaggle): WORLD vocoder for chain B / speaker transform, figures
build = ["pyworld-prebuilt", "matplotlib"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.3,<0.13"
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
# cpu extra: CPU wheels (all platforms); gpu extra: CUDA 12.6 wheels on Linux and Windows (macOS has no CUDA build: PyPI)
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "gpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: needs the aligner checkpoint (one-clip smoke test) or builds a mini dataset (integration)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
